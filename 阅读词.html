<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>阅读词（测试版）</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--ink:#1c2230;--sub:#5f6877;--faint:#8b93a1;--line:#e2e5ea;--acc:#2f6fdb;--acc-ink:#fff;--acc-weak:#e9f0fd;--new:#2f6fdb;--learn:#d4453c;--rev:#2a9a49;--sus:#b27a00;--sus-bg:#fff6dc;--ok-bg:#e8f6ec;--warn:#ff9800;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05)}
  @media (prefers-color-scheme:dark){:root{--bg:#13161b;--card:#1c2027;--ink:#e6e9ef;--sub:#a1a9b6;--faint:#7b8494;--line:#2d333d;--acc:#6b9cf4;--acc-ink:#0d1320;--acc-weak:#1f2c44;--new:#6b9cf4;--learn:#ef7a71;--rev:#5ec27b;--sus:#e2b440;--sus-bg:#362c18;--ok-bg:#1b3324;--shadow:none}}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;-webkit-tap-highlight-color:transparent}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
  button.ghost{background:transparent;border-color:transparent;color:var(--sub)}
  button.warn{color:var(--sus);border-color:var(--sus)}
  input[type=text],select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;min-width:0}
  input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc);margin:0;flex:none}
  #banner{background:var(--warn);color:#fff;text-align:center;padding:5px 10px;font-weight:700;font-size:13px}
  .wrap{max-width:720px;margin:0 auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom))}
  .wrap.wide{max-width:1000px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
  h1{font-size:21px;margin:4px 0 12px}
  h2{font-size:17px;margin:0 0 10px}
  .sub{color:var(--sub)}
  .faint{color:var(--faint);font-size:13px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .sp{flex:1}
  .chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;background:var(--acc-weak);color:var(--acc);font-weight:600;white-space:nowrap}
  .chip.lv{background:var(--ok-bg);color:var(--rev)}
  .n-new{color:var(--new);font-weight:700}.n-learn{color:var(--learn);font-weight:700}.n-rev{color:var(--rev);font-weight:700}.n-sus{color:var(--sus);font-weight:700}
  .deck{display:flex;align-items:center;gap:16px;cursor:pointer;padding:20px;border-radius:16px}
  .deck .ic{width:54px;height:54px;border-radius:14px;background:var(--acc-weak);display:grid;place-items:center;font-size:26px;flex:none}
  .deck .nm{font-size:20px;font-weight:700}
  .stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:4px;font-size:14px}
  .paper{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
  .paper-h{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--acc-weak);font-weight:700;cursor:pointer}
  .sec{display:flex;align-items:center;gap:10px;padding:11px 14px 11px 40px;border-top:1px solid var(--line);cursor:pointer}
  .sec .cnt{margin-left:auto;font-size:13px;color:var(--sub);white-space:nowrap}
  .bottom{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 -16px -16px;border-radius:0 0 14px 14px}
  .topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .counts{font-size:17px;display:flex;gap:10px;margin:0 6px;font-variant-numeric:tabular-nums}
  .counts .cur{text-decoration:underline;text-underline-offset:4px}
  .flash{min-height:42vh;display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 18px}
  .src{font-size:13px;color:var(--faint);margin-bottom:22px}
  .word{font-size:38px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
  .ipa{color:var(--sub);margin-top:6px}
  .pos{display:inline-block;margin-right:6px;font-style:italic;color:var(--sub)}
  .say{border-radius:999px;padding:2px 10px;margin-left:8px;font-size:15px;vertical-align:middle}
  .ans{border-top:1px dashed var(--line);margin-top:20px;padding-top:18px;width:100%}
  .meaning{font-size:24px;font-weight:700}
  .ex{text-align:left;max-width:560px;margin:14px auto 0}
  .ex .en{margin-bottom:6px}.ex b{color:var(--acc)}.ex .cn{color:var(--sub)}
  .grade{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
  .grade button{padding:10px 4px;display:flex;flex-direction:column;align-items:center;font-weight:600}
  .grade button small{font-weight:400;color:var(--sub);font-size:12px}
  .g1{color:var(--learn)}.g2{color:var(--sub)}.g3{color:var(--rev)}.g4{color:var(--acc)}
  .showbtn{width:100%;padding:12px;margin-top:14px}
  .undo-list{font-size:12px;color:var(--sub);margin:-2px 0 10px}
  .undo-list span{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin:2px 4px 0 0}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
  .seg button{border:0;border-radius:0;padding:5px 11px;background:var(--card)}
  .seg button.on{background:var(--acc);color:var(--acc-ink)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:12px;color:var(--sub);font-weight:600;white-space:nowrap}
  tr.is-sus td{background:var(--sus-bg)}
  .tbl-wrap{overflow-x:auto}
  .empty{text-align:center;padding:40px 16px;color:var(--sub)}
  .big{font-size:40px}
  .err{color:var(--learn)}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#222833;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:flex;gap:12px;align-items:center;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
  .toast button{background:transparent;border-color:#5a6372;color:#9fc1ff;padding:2px 10px}
  .sync{position:fixed;right:8px;bottom:6px;font-size:11px;color:var(--sub);background:var(--card);padding:2px 8px;border-radius:8px;border:1px solid var(--line)}
  .sync.bad{color:#fff;background:var(--learn);border-color:var(--learn)}
  input.code{width:100%;font-size:20px;padding:12px;letter-spacing:2px;text-transform:uppercase}
  @media (max-width:560px){.word{font-size:30px}.meaning{font-size:20px}.sec{padding-left:24px}.hide-s{display:none}}
</style>
</head>
<body>
<div id="banner">⚠️ 测试版 · 阅读词</div>
<div id="app"><div class="empty">加载中…</div></div>
<div id="toast-root"></div>
<div id="sync" class="sync" hidden></div>

<script type="module">
import { createStudentApi, createMockStudentApi, stateOf } from './lib/yuedu-api.js';
import { CFG, answer, previewIntervals, formatDelay, buildQueue, nextCard } from './lib/anki-sched.js';
import { mediaBase } from './lib/config.js';

const $ = (s) => document.querySelector(s);
const app = $('#app');
const MOCK = new URLSearchParams(location.search).get('mock') === '1';
const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { /* 忽略 */ } };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const boldHtml = (s) => esc(s).replace(/&lt;(\/?)b&gt;/g, '<$1b>');   // 例句只允许 <b>
const normCode = (s) => (s || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase();

// ---------- 学习码：从链接 #k=… 取，存本机（和 Augie 的页面分开存），再把地址栏清干净 ----------
let code = '';
{
  const m = location.hash.match(/k=([^&]+)/);
  if (m) { code = normCode(decodeURIComponent(m[1])); if (code.length === 16 && !MOCK) lsSet('yuedu_code', code); history.replaceState(null, '', location.pathname + location.search); }
  if (MOCK) { if (code.length !== 16) code = normCode(sessionStorage.getItem('yuedu_mock_code')) || 'MOCKMOCKMOCKMOCK'; try { sessionStorage.setItem('yuedu_mock_code', code); } catch (e) { /* 忽略 */ } }   // 离线演示不动真实的学习码
  else if (!code) code = normCode(lsGet('yuedu_code'));
}

// ---------- 状态 ----------
const S = { api: null, learner: null, skew: 0, today: 0, papers: [], cards: new Map(), log: [], pending: [], flushing: false,
  view: 'home', pick: null, sess: null, undo: [], wf: { unit: 'all', st: 'all', q: '' } };
const UNDO_MAX = 3;
const now = () => Date.now() + S.skew;
const unitOf = (c) => c.paper + '|' + c.sec;
const paperOf = (id) => S.papers.find((p) => p.paper_id === id);
const secOf = (pid, sid) => (paperOf(pid)?.sections || []).find((s) => s.id === sid);
const units = () => S.papers.flatMap((p) => p.sections.map((s) => p.paper_id + '|' + s.id));
const secTitle = (s) => s ? (s.piece || s.board) : '';
const srcLine = (c) => { const p = paperOf(c.paper), s = secOf(c.paper, c.sec); return `${p ? p.name : ''} ${secTitle(s)} ${s ? s.level : ''}`.trim(); };
const kind = (c) => (c.suspended ? 'sus' : c.type === 0 ? 'new' : c.type === 2 && c.queue === 2 ? 'rev' : 'learn');

async function boot() {
  try {
    if (!MOCK && code.length !== 16) return showCodeInput();
    S.api = MOCK ? await createMockStudentApi(code) : createStudentApi(code);
    try { S.pending = JSON.parse(lsGet('yuedu_pending') || '[]'); } catch (e) { S.pending = []; }
    if (S.pending.length) await flush();
    await refresh();
    render();
  } catch (e) { showError(e); }
}
async function refresh() {
  const r = await S.api.getState();
  S.learner = r.learner; S.skew = r.nowMs - Date.now(); S.today = r.today;
  S.papers = [...r.papers].sort((a, b) => (a.sort - b.sort) || a.name.localeCompare(b.name, 'zh'));
  S.cards = new Map(r.cards.map((c) => [c.key, c]));
  S.log = r.todayLog.map((x) => ({ key: x[0], prev_type: x[1], type: x[2] }));
}
function showError(e) {
  const m = String(e.message || e);
  const bad = m === 'invalid code' || m === 'bad code', notYd = /not yuedu/.test(m), noSql = /does not exist|schema cache|404/.test(m);
  app.innerHTML = `<div class="wrap"><div class="card empty"><div class="big">😕</div><h2>${bad ? '链接不对或已失效' : notYd ? '这个链接不是“阅读词”的链接' : '打不开'}</h2>
    <p class="sub">${bad ? '请让老师重新发一次链接。' : notYd ? '请用老师发给你的“阅读词”链接打开。' : noSql ? '系统还没准备好（数据库还没运行 10 号 SQL），请告诉老师。' : '网络可能不好，请稍后重试。'}</p>
    <p class="faint">${esc(m)}</p><button class="pri" onclick="location.reload()">重试</button></div></div>`;
}
function showCodeInput() {
  app.innerHTML = `<div class="wrap"><div class="card"><h1>请打开老师发给你的链接</h1><p class="sub">或者在这里输入链接里 #k= 后面的 16 位学习码。</p>
    <input class="code" type="text" id="ci" maxlength="24" autocomplete="off" autocapitalize="characters"><p></p><button class="pri" id="cb">进入</button></div></div>`;
  $('#cb').onclick = () => { const c = normCode($('#ci').value); if (c.length !== 16) { alert('学习码是 16 位字母和数字'); return; } lsSet('yuedu_code', c); location.reload(); };
}

// ---------- 今天的计数和队列（每天上限按“阅读词”整体算） ----------
function todayCounts() { return { newDone: new Set(S.log.filter((l) => l.prev_type === 0).map((l) => l.key)).size, revDone: S.log.filter((l) => l.type === 1).length }; }
const limits = () => ({ newPerDay: S.learner.new_per_day, revPerDay: S.learner.rev_per_day });
function queueFor(sel) {
  const set = sel ? new Set(sel) : null;
  const list = [...S.cards.values()].filter((c) => !set || set.has(unitOf(c)));
  return buildQueue(list, now(), todayCounts(), limits());
}
const qn = (q) => ({ n: q.news.length, l: q.learnDue.length + q.interday.length + q.learnAhead.length, r: q.reviews.length });
function stats(sel) {
  const set = sel ? new Set(sel) : null, o = { total: 0, new: 0, learn: 0, rev: 0, sus: 0 };
  for (const c of S.cards.values()) { if (set && !set.has(unitOf(c))) continue; o.total++; o[kind(c)]++; }
  return o;
}

// ---------- 页面 ----------
function render() {
  stopAudio();
  if (S.view === 'pick') renderPick(); else if (S.view === 'study') renderStudy(); else if (S.view === 'words') renderWords(); else renderHome();
}
function go(v) { S.view = v; if (v !== 'study') S.sess = null; render(); window.scrollTo(0, 0); }

function renderHome() {
  const all = units(), q = queueFor(all), k = qn(q), st = stats();
  const body = !all.length ? `<div class="card empty"><div class="big">📭</div><h2>老师还没有给你布置词</h2><div class="sub">老师布置之后，这里会出现「阅读词」，点进去就能背。</div></div>`
    : `<div class="card deck" id="deck"><div class="ic">📖</div><div class="sp"><div class="nm">阅读词</div>
        <div class="stats"><span>待复习 <span class="n-rev">${k.r + k.l}</span></span><span>今天可学新词 <span class="n-new">${k.n}</span></span><span class="sub">已布置 ${st.total} 词</span></div></div>
        <button class="pri">进入</button></div>
      <div class="row" style="justify-content:flex-end"><button class="ghost" id="mywords">📋 我的词（查看 / 不再背诵 / 恢复）</button></div>`;
  app.innerHTML = `<div class="wrap"><h1>你好，${esc(S.learner.name)}</h1>${body}
    ${MOCK ? `<p class="faint">离线演示：进度只存在这台设备上。<a href="#" id="rs">清空演示数据</a></p>` : ''}</div>`;
  $('#deck')?.addEventListener('click', () => { S.pick = null; go('pick'); });
  $('#mywords')?.addEventListener('click', () => go('words'));
  $('#rs')?.addEventListener('click', (e) => { e.preventDefault(); S.api.reset(); location.reload(); });
}

function ensurePick() {
  const all = units();
  if (!S.pick) { let last = []; try { last = JSON.parse(lsGet('yuedu_pick') || '[]'); } catch (e) { /* 忽略 */ } last = last.filter((u) => all.includes(u)); S.pick = new Set(last.length ? last : all); }
  for (const u of [...S.pick]) if (!all.includes(u)) S.pick.delete(u);
}
function renderPick() {
  ensurePick();
  const sel = [...S.pick], q = queueFor(sel), k = qn(q), cn = todayCounts();
  const blocks = S.papers.map((p) => {
    const us = p.sections.map((s) => p.paper_id + '|' + s.id), on = us.filter((u) => S.pick.has(u)).length;
    return `<div class="paper"><label class="paper-h" data-paper="${esc(p.paper_id)}"><input type="checkbox" ${on === us.length ? 'checked' : ''} data-ind="${on && on < us.length ? 1 : 0}" tabindex="-1"><span>${esc(p.name)}</span></label>
      ${p.sections.map((s) => { const u = p.paper_id + '|' + s.id, o = stats([u]), qq = qn(queueFor([u]));
        return `<label class="sec" data-unit="${esc(u)}"><input type="checkbox" ${S.pick.has(u) ? 'checked' : ''} tabindex="-1">
          <span><b>${esc(secTitle(s))}</b>${s.piece ? ` <span class="faint hide-s">${esc(s.board)}</span>` : ''}</span><span class="chip lv">${esc(s.level)}</span>
          <span class="cnt">${o.total} 词 · <span class="n-new">新 ${o.new}</span> · <span class="n-rev">待复习 ${qq.r + qq.l}</span>${o.sus ? ` · <span class="n-sus">不再背 ${o.sus}</span>` : ''}</span></label>`; }).join('')}</div>`;
  }).join('');
  const n = k.n + k.l + k.r;
  app.innerHTML = `<div class="wrap"><div class="topbar"><button class="ghost" id="back">← 返回</button><h1 style="margin:0">阅读词</h1></div>
    <div class="card" style="padding-bottom:0"><h2>今天背哪些？</h2><div class="faint" style="margin:-4px 0 12px">勾试卷 = 背这套卷子的全部词；也可以只勾其中几篇。</div>
      ${blocks}
      <div class="bottom"><div class="sp"><div>这次会背：<span class="n-new">新词 ${k.n}</span> · <span class="n-learn">学习中 ${k.l}</span> · <span class="n-rev">复习 ${k.r}</span></div>
        <div class="faint">老师设定每天新词 ${S.learner.new_per_day} 个，今天已学 ${cn.newDone} 个</div></div>
        <button class="pri" id="start" ${n ? '' : 'disabled'} style="padding:10px 22px">开始背</button></div></div></div>`;
  app.querySelectorAll('[data-ind="1"]').forEach((el) => { el.indeterminate = true; });
  $('#back').onclick = () => go('home');
  app.querySelectorAll('[data-unit]').forEach((el) => el.onclick = (e) => { e.preventDefault(); const u = el.dataset.unit; S.pick.has(u) ? S.pick.delete(u) : S.pick.add(u); renderPick(); });
  app.querySelectorAll('[data-paper]').forEach((el) => el.onclick = (e) => { e.preventDefault(); const p = paperOf(el.dataset.paper), us = p.sections.map((s) => p.paper_id + '|' + s.id), all = us.every((u) => S.pick.has(u)); us.forEach((u) => (all ? S.pick.delete(u) : S.pick.add(u))); renderPick(); });
  $('#start').onclick = startStudy;
}

// ---------- 背诵 ----------
let player = null, playToken = 0;
function stopAudio() { playToken++; if (player) { try { player.pause(); } catch (e) { /* 忽略 */ } } }
function say(c) {
  if (!c) return;
  if (c.d.audio) {
    const my = ++playToken; if (!player) player = new Audio();
    player.src = mediaBase('yuedu') + c.d.audio; player.play().catch(() => {}); return my;
  }
  try { const u = new SpeechSynthesisUtterance(c.d.w); u.lang = 'en-GB'; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) { /* 忽略 */ }
}
function startStudy() {
  // 第一次点击里“解锁”声音（iPad/Safari 必须由点击触发）
  if (!player) { player = new Audio(); player.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA='; player.play().catch(() => {}); }
  lsSet('yuedu_pick', JSON.stringify([...S.pick]));
  S.sess = { sel: [...S.pick], cur: null, showing: 'q', t0: 0, shownNew: 0, shownRev: 0 };
  S.view = 'study'; nextStep();
}
function nextStep(keep) {
  const ss = S.sess, q = queueFor(ss.sel);
  if (!keep) { ss.cur = nextCard(q, ss.shownNew, ss.shownRev); ss.showing = 'q'; ss.t0 = Date.now(); }
  renderStudy(q);
  if (ss.cur && ss.showing === 'q') say(ss.cur);
}
function undoBar() {
  return S.undo.length ? `<div class="undo-list">可撤销：${S.undo.slice().reverse().map((u, i) => `<span>${i + 1}. ${esc(u.label)}</span>`).join('')}</div>` : '';
}
function renderStudy(q) {
  const ss = S.sess; q ||= queueFor(ss.sel); const k = qn(q), c = ss.cur, kd = c ? (c.queue === 0 ? 'n' : c.queue === 2 ? 'r' : 'l') : '';
  const top = `<div class="topbar"><button class="ghost" id="back">← 阅读词</button>
      <div class="counts" title="蓝=新词 红=学习中 绿=复习"><span class="n-new ${kd === 'n' ? 'cur' : ''}">${k.n}</span><span class="n-learn ${kd === 'l' ? 'cur' : ''}">${k.l}</span><span class="n-rev ${kd === 'r' ? 'cur' : ''}">${k.r}</span></div>
      <span class="sp"></span>${c ? '<button class="warn" id="sus" title="这个词以后不再出现；可以撤销，也可以在「我的词」里恢复">🚫 不再背诵</button>' : ''}
      <button id="undo" ${S.undo.length ? '' : 'disabled'} title="快捷键 Z">↶ 撤销${S.undo.length ? `（还能撤 ${S.undo.length} 步）` : ''}</button></div>${undoBar()}`;
  if (!c) {
    const nxt = [...S.cards.values()].filter((x) => !x.suspended && x.queue === 1 && ss.sel.includes(unitOf(x))).sort((a, b) => a.due - b.due)[0];
    const wait = nxt ? Math.max(Math.ceil((nxt.due - now() / 1000) / 60), 1) : 0;
    app.innerHTML = `<div class="wrap">${top}<div class="card empty"><div class="big">🎉</div><h2>这几篇今天背完了</h2>
      <div class="sub">${wait ? `还有学习中的词约 ${wait} 分钟后再出现。` : '真棒！明天再来。'}</div>
      <div class="row" style="justify-content:center;margin-top:14px"><button id="repick">换几篇背</button><button class="pri" id="home">回首页</button></div></div></div>`;
    $('#repick').onclick = () => go('pick'); $('#home').onclick = () => go('home');
  } else {
    const d = c.d;
    const front = `<div class="src">${esc(srcLine(c))}</div>
      <div class="word">${esc(d.w)}<button class="say" id="say" title="再听一遍">🔊</button></div>
      <div class="ipa">${d.pos ? `<span class="pos">${esc(d.pos)}</span>` : ''}${d.ipa ? `/${esc(d.ipa)}/` : ''}</div>`;
    const back = ss.showing === 'a' ? `<div class="ans"><div class="meaning">${esc(d.mean)}</div>${d.cefr ? `<div style="margin-top:6px"><span class="chip">CEFR ${esc(d.cefr)}</span></div>` : ''}
      <div class="ex">${d.en ? `<div class="en">${boldHtml(d.en)}</div>` : ''}${d.cn ? `<div class="cn">${boldHtml(d.cn)}</div>` : ''}</div></div>` : '';
    let foot;
    if (ss.showing === 'a') {
      const pv = previewIntervals(c, now()), lab = ['重来', '困难', '良好', '简单'];
      foot = `<div class="grade">${[1, 2, 3, 4].map((e) => `<button class="g${e}" data-e="${e}">${lab[e - 1]}<small>${formatDelay(pv[e - 1])}</small></button>`).join('')}</div>`;
    } else foot = '<button class="pri showbtn" id="show">显示答案</button>';
    app.innerHTML = `<div class="wrap">${top}<div class="card flash">${front}${back}</div>${foot}
      <div class="faint hide-s" style="margin-top:10px;text-align:center">键盘：空格 显示答案 · 1–4 作答 · Z 撤销</div></div>`;
    $('#say').onclick = () => say(c);
    $('#sus').onclick = suspendCurrent;
    $('#show')?.addEventListener('click', showAnswer);
    app.querySelectorAll('[data-e]').forEach((b) => b.onclick = () => onAnswer(+b.dataset.e));
  }
  $('#back').onclick = () => go('pick');
  $('#undo').onclick = doUndo;
}
function showAnswer() { if (!S.sess?.cur) return; S.sess.showing = 'a'; renderStudy(); }
const newUid = () => (crypto.randomUUID ? crypto.randomUUID() : 'u' + Date.now() + Math.random().toString(16).slice(2));
function pushUndo(u) { S.undo.push(u); while (S.undo.length > UNDO_MAX) S.undo.shift(); }
function onAnswer(ease) {
  const ss = S.sess, c = ss.cur; if (!c || ss.showing !== 'a') return;
  const prev = { ...c };
  const { card, log } = answer(c, ease, now(), CFG);
  log.uid = newUid(); log.time_ms = Math.min(Date.now() - ss.t0, 60000);
  if (c.queue === 0) ss.shownNew++; else if (c.queue === 2) ss.shownRev++;
  Object.assign(c, card);
  S.log.push({ key: c.key, prev_type: log.prev_type, type: log.type });
  pushUndo({ kind: 'answer', key: c.key, prev, uid: log.uid, label: ['', '重来', '困难', '良好', '简单'][ease] + ' · ' + c.d.w });
  enqueue({ kind: 'answer', key: c.key, state: stateOf(c), log });
  nextStep();
}
function setSus(c, on) {
  pushUndo({ kind: 'sus', key: c.key, was: c.suspended, label: (on ? '不再背诵' : '恢复背诵') + ' · ' + c.d.w });
  c.suspended = on;
  enqueue({ kind: 'sus', key: c.key, flag: on });
}
function suspendCurrent() {
  const c = S.sess?.cur; if (!c) return;
  setSus(c, true); toast(`「${c.d.w}」以后不再背诵`, true);
  nextStep();
}
function doUndo() {
  const u = S.undo.pop(); if (!u) return;
  const c = S.cards.get(u.key); if (!c) return render();
  if (u.kind === 'answer') {
    Object.assign(c, u.prev);
    const i = S.log.map((l) => l.key).lastIndexOf(u.key); if (i >= 0) S.log.splice(i, 1);
    if (S.sess) { if (u.prev.queue === 0) S.sess.shownNew = Math.max(S.sess.shownNew - 1, 0); else if (u.prev.queue === 2) S.sess.shownRev = Math.max(S.sess.shownRev - 1, 0); }
    enqueue({ kind: 'undo', key: u.key, prev: u.prev, uid: u.uid });
  } else {
    c.suspended = u.was;
    enqueue({ kind: 'sus', key: u.key, flag: u.was });
  }
  toast('已撤销：' + u.label);
  if (S.view === 'study' && S.sess && !c.suspended && S.sess.sel.includes(unitOf(c))) { S.sess.cur = c; S.sess.showing = 'q'; S.sess.t0 = Date.now(); nextStep(true); }
  else if (S.view === 'study') nextStep();
  else render();
}

// ---------- 我的词 ----------
function renderWords() {
  const f = S.wf, q = f.q.trim().toLowerCase(), all = units();
  if (f.unit !== 'all' && !all.includes(f.unit)) f.unit = 'all';
  let list = [...S.cards.values()].sort((a, b) => (a.paper === b.paper ? a.ord - b.ord : a.paper < b.paper ? -1 : 1));
  if (f.unit !== 'all') list = list.filter((c) => unitOf(c) === f.unit);
  if (f.st !== 'all') list = list.filter((c) => kind(c) === f.st);
  if (q) list = list.filter((c) => c.d.w.toLowerCase().includes(q) || (c.d.mean || '').includes(q));
  const stName = { new: '新词', learn: '学习中', rev: '复习中', sus: '不再背诵' }, td = S.today;
  const dueTxt = (c) => (c.suspended || c.type === 0 ? '—' : c.queue === 1 ? '今天' : c.due <= td ? '今天' : `${c.due - td} 天后`);
  const shown = list.slice(0, 300);
  app.innerHTML = `<div class="wrap wide"><div class="topbar"><button class="ghost" id="back">← 返回</button><h1 style="margin:0">我的词</h1><span class="sp"></span>
      <button id="undo" ${S.undo.length ? '' : 'disabled'}>↶ 撤销${S.undo.length ? `（还能撤 ${S.undo.length} 步）` : ''}</button></div>${undoBar()}
    <div class="card"><div class="filters">
      <select id="fu"><option value="all">全部试卷和篇章</option>${S.papers.map((p) => `<optgroup label="${esc(p.name)}">${p.sections.map((s) => { const u = p.paper_id + '|' + s.id; return `<option value="${esc(u)}" ${f.unit === u ? 'selected' : ''}>${esc(secTitle(s))} · ${esc(s.level)}</option>`; }).join('')}</optgroup>`).join('')}</select>
      <div class="seg">${[['all', '全部'], ['new', '新词'], ['learn', '学习中'], ['rev', '复习中'], ['sus', '不再背诵']].map(([v, t]) => `<button data-st="${v}" class="${f.st === v ? 'on' : ''}">${t}</button>`).join('')}</div>
      <input type="text" id="fq" placeholder="搜单词或中文" value="${esc(f.q)}" style="flex:1;min-width:140px"></div>
      <div class="faint" style="margin-bottom:6px">共 ${list.length} 词${list.length > 300 ? '（先显示前 300 个，可以用上面的筛选缩小范围）' : ''}</div>
      <div class="tbl-wrap"><table><thead><tr><th>单词</th><th>意思</th><th class="hide-s">篇</th><th>状态</th><th class="hide-s">下次</th><th></th></tr></thead><tbody>
      ${shown.map((c) => `<tr class="${c.suspended ? 'is-sus' : ''}"><td><b>${esc(c.d.w)}</b> <span class="faint">${esc(c.d.pos)}</span></td><td>${esc(c.d.mean)}</td>
        <td class="hide-s">${esc(secTitle(secOf(c.paper, c.sec)))}</td><td class="n-${kind(c)}">${stName[kind(c)]}</td><td class="hide-s">${dueTxt(c)}</td>
        <td style="text-align:right">${c.suspended ? `<button data-un="${esc(c.key)}">恢复背诵</button>` : `<button class="warn" data-su="${esc(c.key)}">不再背诵</button>`}</td></tr>`).join('')}
      </tbody></table></div>${list.length ? '' : '<div class="empty">没有符合条件的词</div>'}</div>
    <p class="faint">“不再背诵”的词不会再出现在背诵里；点“恢复背诵”就回来了。最近 3 步操作都可以撤销。</p></div>`;
  $('#back').onclick = () => go('home');
  $('#undo').onclick = doUndo;
  $('#fu').onchange = (e) => { f.unit = e.target.value; renderWords(); };
  app.querySelectorAll('[data-st]').forEach((b) => b.onclick = () => { f.st = b.dataset.st; renderWords(); });
  const fq = $('#fq'); fq.oninput = () => { f.q = fq.value; const p = fq.selectionStart; renderWords(); const n = $('#fq'); n.focus(); n.setSelectionRange(p, p); };
  app.querySelectorAll('[data-su]').forEach((b) => b.onclick = () => { const c = S.cards.get(b.dataset.su); setSus(c, true); renderWords(); toast(`「${c.d.w}」以后不再背诵`, true); });
  app.querySelectorAll('[data-un]').forEach((b) => b.onclick = () => { const c = S.cards.get(b.dataset.un); setSus(c, false); renderWords(); toast(`「${c.d.w}」已恢复背诵`, true); });
}

// ---------- 提示 ----------
let toastT = null;
function toast(msg, undoable) {
  const r = $('#toast-root'); clearTimeout(toastT);
  r.innerHTML = `<div class="toast"><span>${esc(msg)}</span>${undoable ? '<button id="tu">撤销</button>' : ''}</div>`;
  $('#tu')?.addEventListener('click', () => { r.innerHTML = ''; doUndo(); });
  toastT = setTimeout(() => { r.innerHTML = ''; }, undoable ? 5000 : 2600);
}

// ---------- 存回云端（按顺序；失败自动重试；重复提交只算一次） ----------
function enqueue(job) { S.pending.push(job); lsSet('yuedu_pending', JSON.stringify(S.pending)); flush(); }
async function flush() {
  if (S.flushing) return; S.flushing = true; setSync();
  while (S.pending.length) {
    const j = S.pending[0];
    try {
      if (j.kind === 'answer') await S.api.answer(j.key, j.state, j.log);
      else if (j.kind === 'undo') await S.api.undo(j.key, j.prev, j.uid);
      else await S.api.setSuspended([j.key], j.flag);
      S.pending.shift(); lsSet('yuedu_pending', JSON.stringify(S.pending)); setSync();
    } catch (e) {
      if (e.status && e.status < 500 && e.status !== 408 && e.status !== 429) {
        console.warn('丢弃无法保存的记录', j, e); S.pending.shift(); lsSet('yuedu_pending', JSON.stringify(S.pending));
        toast('有一步没保存上：' + (e.message || e.status) + '。请刷新页面。'); continue;
      }
      setSync(true); S.flushing = false; setTimeout(flush, 8000); return;
    }
  }
  S.flushing = false; setSync();
}
function setSync(bad) {
  const el = $('#sync'), n = S.pending.length;
  el.hidden = !n && !bad; el.className = 'sync' + (bad ? ' bad' : ''); el.textContent = bad ? `网络不稳，${n} 条待保存（会自动重试）` : `正在保存 ${n}…`;
}
window.addEventListener('beforeunload', (e) => { if (S.pending.length) { e.preventDefault(); e.returnValue = ''; } });

// ---------- 键盘（同 Anki：空格/回车 显示答案或“良好”，1-4 作答，Z 撤销） ----------
document.addEventListener('keydown', (e) => {
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { if (S.view === 'study' || S.view === 'words') { e.preventDefault(); doUndo(); } return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'z' || e.key === 'Z') { if (S.view === 'study' || S.view === 'words') { e.preventDefault(); doUndo(); } return; }
  const ss = S.sess; if (S.view !== 'study' || !ss || !ss.cur) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (ss.showing === 'q') showAnswer(); else onAnswer(3); }
  else if (['1', '2', '3', '4'].includes(e.key) && ss.showing === 'a') onAnswer(+e.key);
});

boot();
</script>
